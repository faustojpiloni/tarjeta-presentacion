<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta de Presentación - Fausto Piloni</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

  @page {
    size: 90mm 50mm;
    margin: 0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background-color: #ffffff;
    color: #111111;
    -webkit-print-color-adjust: exact;
  }

  /* Dimensiones exactas de la tarjeta */
  .card-page {
    width: 90mm;
    height: 50mm;
    padding: 5mm 6mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Encabezado: Nombre y Subtítulo Centrados */
  .header-block {
    text-align: center;
    margin-bottom: 2mm;
  }

  .name {
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: #000000;
    text-transform: uppercase;
    line-height: 1.1;
    display: inline-block;
  }

  .subtitle {
    font-size: 8.5pt;
    font-weight: 400;
    letter-spacing: 2.5px;
    color: #222222;
    text-transform: uppercase;
    margin-top: 1.5mm;
    margin-right: -1px;
    display: block;
  }

  /* Línea divisoria horizontal */
  .divider {
    width: 100%;
    height: 0.5px;
    background-color: #333333;
    margin: 2.5mm 0 3.5mm 0;
  }

  /* Sección Inferior: Flexbox a 2 columnas */
  .content-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 1.5mm;
  }

  /* Columna Izquierda: Datos de contacto */
  .contact-wrapper {
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 2.5mm;
  }

  .contact-text {
    font-size: 7.5pt;
    font-weight: 400;
    color: #222222;
    white-space: nowrap;
  }

  /* Contenedor transparente para alineación perfecta */
  .icon-box {
    width: 4.0mm;
    height: 4.0mm;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Estilos para íconos (overflow: visible evita que se corten los bordes) */
  .icon {
    width: 3.4mm;
    height: 3.4mm;
    fill: #222222;
    overflow: visible;
    flex-shrink: 0;
  }

  /* Íconos de Mundo y Mail */
  .icon-lg {
    width: 4.0mm;
    height: 4.0mm;
  }

  /* Columna Derecha: Código QR */
  .qr-container {
    width: 17.5mm;
    height: 17.5mm;
    flex-shrink: 0;
  }

  .qr-container img, .qr-container svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>

  <div class="card-page">
    <!-- Encabezado Centrado -->
    <div class="header-block">
      <div class="name">FAUSTO PILONI</div>
      <div class="subtitle">MEDICIONES ACÚSTICAS</div>
    </div>
    
    <!-- Divisor -->
    <div class="divider"></div>

    <!-- Bloque Inferior: Contacto a la Izquierda | QR a la Derecha -->
    <div class="content-bottom">
      <div class="contact-wrapper">
        <div class="contact-row">
          <div class="icon-box">
            <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm6.93 6h-3.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.93 8zM12 4.07c.91 1.17 1.64 2.53 2.13 3.93H9.87c.49-1.4 1.22-2.76 2.13-3.93zM4.26 14a7.82 7.82 0 0 1 0-4h3.92a17.6 17.6 0 0 0 0 4zm.81 2h3.95a15.65 15.65 0 0 0 1.38 3.56A8.03 8.03 0 0 1 5.07 16zm3.95-8H5.07a8.03 8.03 0 0 1 3.53-3.56A15.65 15.65 0 0 0 7.2 8zm4.8 11.93c-.91-1.17-1.64-2.53-2.13-3.93h4.26c-.49 1.4-1.22 2.76-2.13 3.93zM14.2 14H9.8c-.14-.65-.2-1.32-.2-2s.06-1.35.2-2h4.4c.14.65.2 1.32.2 2s-.06 1.35-.2 2zm1.75 5.56a15.65 15.65 0 0 0 1.38-3.56h3.95a8.03 8.03 0 0 1-3.53 3.56zM15.82 14a17.6 17.6 0 0 0 0-4h3.92a7.82 7.82 0 0 1 0 4z"/></svg>
          </div>
          <span class="contact-text">faustojpiloni.github.io</span>
        </div>

        <div class="contact-row">
          <div class="icon-box">
            <svg class="icon" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
          </div>
          <span class="contact-text">+54 9 11 5336-2484</span>
        </div>

        <div class="contact-row">
          <div class="icon-box">
            <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          </div>
          <span class="contact-text">faustopiloni@gmail.com</span>
        </div>
      </div>

      <div class="qr-container">
        <img src="qr.svg" alt="Código QR Portafolio">
      </div>
    </div>
  </div>

</body>
</html>
